name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "vfs-browser-v*"

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-research.txt
            requirements-build.txt

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.200"

      - name: Install Python build dependencies
        shell: pwsh
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Build and test Windows release
        shell: pwsh
        run: |
          ./tools/Publish-Windows.ps1 `
            -OutputDirectory artifacts/endfield-vfs-browser `
            -ArchivePath artifacts/endfield-vfs-browser-win-x64.zip `
            -PythonExe python `
            -DotnetExe dotnet

      - name: Validate packaged worker and file manifest
        shell: pwsh
        run: |
          ./tools/Test-WindowsRelease.ps1 `
            -ReleaseDirectory artifacts/endfield-vfs-browser `
            -IsolatedRuntime

      - name: Upload Windows release
        uses: actions/upload-artifact@v7
        with:
          name: endfield-vfs-browser-win-x64-${{ github.sha }}
          path: |
            artifacts/endfield-vfs-browser-win-x64.zip
            artifacts/endfield-vfs-browser-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
